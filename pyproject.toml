[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "pyisr"
version = "0.1.0"
description = "Tools for reciprocal space mapping (RSM) from TIFF files with hklpy (E4CV) geometry."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Xiaogang Yang", email = "yangxg@bnl.gov" }
]
license = { file = "LICENSE" }

# register your napari dock-widget hook
[project.entry-points."napari.experimental_provide_dock_widget"]
pyisr_rsm = "napari_rsm:napari_experimental_provide_dock_widget"

# tell Hatchling which files to include in every build/editable install
[tool.hatch.build]
# include all top-level .py modules
include = ["*.py"]

# no [project].dependencies section

# ------------ Pixi dev‐env config ------------
[tool.pixi.project]
name = "pyisr-dev"
description = "PyISR development environment"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[tool.pixi.dependencies]
python    = "3.13.*"
numpy = ">=2.3.3,<3"
pandas = ">=2.3.3,<3"
dask = ">=2025.9.1,<2026"
scipy = ">=1.16.2,<2"
h5py = ">=3.14.0,<4"
hdf5plugin = ">=5.1.0,<6"
tifffile = ">=2025.9.20,<2026"
imageio = ">=2.37.0,<3"
matplotlib = ">=3.10.6,<4"
vtk = ">=9.4.2,<10"
ipykernel = ">=6.30.1,<7"
tiled = ">=0.1.6,<0.2"
napari = ">=0.6.4,<0.7"
magicgui = ">=0.10.1,<0.11"
pyside6 = ">=6.9.2,<7"
jupyter = ">=1.1.1,<2"




# pip‐only packages or your editable install
[tool.pixi.pypi-dependencies]

pyisr = { path = ".", editable = true }
xrayutilities = ">=1.7.10, <2"

[tool.pixi.tasks]
develop = "pip install -e ."
check = "python -c \"import numpy as np; print('Env OK, numpy', np.__version__)\""
